<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="pharma-oss">
  <defs>
    <linearGradient id="tileGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2AD3BE" />
      <stop offset="0.55" stop-color="#0F766E" />
      <stop offset="1" stop-color="#0B5766" />
    </linearGradient>
    <radialGradient id="tileGloss" cx="0.28" cy="0.18" r="0.78">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <clipPath id="capsuleClip">
      <rect x="95" y="185" width="322" height="142" rx="71" />
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tileGradient)" />
  <rect width="512" height="512" rx="112" fill="url(#tileGloss)" />

  <g transform="rotate(-45 256 256)">
    <g clip-path="url(#capsuleClip)">
      <rect x="95" y="185" width="158" height="142" fill="#ffffff" />
      <rect x="259" y="185" width="158" height="142" fill="#ffffff" fill-opacity="0.55" />
      <g fill="#ffffff" fill-opacity="0.95">
        <circle cx="302" cy="232" r="9.5" />
        <circle cx="352" cy="256" r="9.5" />
        <circle cx="302" cy="280" r="9.5" />
      </g>
    </g>
  </g>
</svg>
